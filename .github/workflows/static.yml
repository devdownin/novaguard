name: Deploy NovaGuard website to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/static.yml'
      - 'scripts/update-site-release.py'
  release:
    types: [published, edited]
  schedule:
    # Releases may receive their APK assets after the published event.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh the published APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/devdownin/novaguard/releases/latest > "$RUNNER_TEMP/novaguard-release.json"
          python3 scripts/update-site-release.py --metadata "$RUNNER_TEMP/novaguard-release.json"
      - name: Check static entry points
        run: |
          test -s site/index.html
          test -s site/guide-mcp.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/assets/mark.svg
          test -s site/assets/screens/surveillance.jpg
          test -s site/assets/screens/historique.jpg
          test -s site/assets/screens/reglages.jpg
          test -f site/.nojekyll
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
