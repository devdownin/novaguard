name: Deploy NovaGuard website to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check static entry points
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test -s site/assets/mark.svg
          test -s site/assets/scene.svg
          test -f site/.nojekyll
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
