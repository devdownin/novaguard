name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # The MCP server is Kotlin; what a PR can run of it is the snapshot JS
      # hands it (no PIN, no secret) and its pure rules (scripts/test-presence-native.sh).
      - name: Jest MCP privacy tests
        run: npx jest __tests__/mcpWiring.test.tsx --runInBand
