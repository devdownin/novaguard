pluginManagement {
    def reactNativeGradlePlugin = file("../node_modules/@react-native/gradle-plugin")

    // GitHub CodeQL's default Java/Kotlin autobuild invokes Gradle directly
    // without first running `npm ci`. React Native resolves its Gradle plugin
    // from node_modules, so prepare only that dependency tree for CodeQL when
    // it is missing. Normal local/CI Android builds are unchanged.
    if (!reactNativeGradlePlugin.exists() && System.getenv("CODEQL_ACTION_VERSION")) {
        def command = ["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"]
        def process = new ProcessBuilder(command)
            .directory(file(".."))
            .inheritIO()
            .start()
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("CodeQL dependency bootstrap failed: npm ci exited with ${exitCode}")
        }
    }

    // PluginManagementSpec accepts a String. Passing a File selects the outer
    // Settings.includeBuild(Object) overload instead, which registers a normal
    // composite build too late to resolve the settings plugin below.
    includeBuild(reactNativeGradlePlugin.absolutePath)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'NovaGuard'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
